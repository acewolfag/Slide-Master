kind = "web"
previewPath = "/"
title = "2Grils.PPT"
version = "1.0.0"
id = "artifacts/2grils-ppt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21918

[services.development]
run = "pnpm --filter @workspace/2grils-ppt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/2grils-ppt", "run", "build" ]
publicDir = "artifacts/2grils-ppt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21918"
BASE_PATH = "/"
