openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 2Grils.PPT API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: templates
  - name: categories
  - name: cart
  - name: orders
  - name: auth
  - name: admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Templates
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List templates with filtering and sorting
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: style
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: slideCount
          in: query
          schema:
            type: integer
        - name: aspectRatio
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, best-seller, price-asc, price-desc, top-rated]
        - name: search
          in: query
          schema:
            type: string
        - name: isFree
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListResponse"

  /templates/featured:
    get:
      operationId: listFeaturedTemplates
      tags: [templates]
      summary: List featured templates for homepage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/best-sellers:
    get:
      operationId: listBestSellerTemplates
      tags: [templates]
      summary: List best-selling templates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/latest:
    get:
      operationId: listLatestTemplates
      tags: [templates]
      summary: List newest templates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get template details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /templates/{id}/related:
    get:
      operationId: getRelatedTemplates
      tags: [templates]
      summary: Get related templates
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/{id}/reviews:
    get:
      operationId: listTemplateReviews
      tags: [templates]
      summary: Get reviews for a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
    post:
      operationId: createReview
      tags: [templates]
      summary: Submit a review for a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # Categories
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all template categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  # Tags
  /tags:
    get:
      operationId: listTags
      tags: [templates]
      summary: List all tags
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"

  # Search
  /search/suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [templates]
      summary: Get search autocomplete suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchSuggestion"

  # Cart
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current session cart
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items:
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add a template to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items/{templateId}:
    delete:
      operationId: removeFromCart
      tags: [cart]
      summary: Remove an item from cart
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/voucher:
    post:
      operationId: applyVoucher
      tags: [cart]
      summary: Apply a voucher code to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyVoucherBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Orders
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List current user orders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order (checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/payment-status:
    get:
      operationId: getOrderPaymentStatus
      tags: [orders]
      summary: Poll payment status for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"

  # User library
  /library:
    get:
      operationId: getLibrary
      tags: [orders]
      summary: Get user purchased templates library
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryItem"

  # Wishlist
  /wishlist:
    get:
      operationId: getWishlist
      tags: [templates]
      summary: Get user wishlist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /wishlist/{templateId}:
    post:
      operationId: addToWishlist
      tags: [templates]
      summary: Add template to wishlist
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: removeFromWishlist
      tags: [templates]
      summary: Remove template from wishlist
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Custom Design Requests
  /custom-requests:
    get:
      operationId: listCustomRequests
      tags: [orders]
      summary: List user custom design requests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomRequest"
    post:
      operationId: createCustomRequest
      tags: [orders]
      summary: Submit a custom design request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRequest"

  /custom-requests/{id}:
    get:
      operationId: getCustomRequest
      tags: [orders]
      summary: Get custom request details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRequest"

  # Blog
  /blog:
    get:
      operationId: listBlogPosts
      tags: [templates]
      summary: List blog posts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

  /blog/{slug}:
    get:
      operationId: getBlogPost
      tags: [templates]
      summary: Get blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"

  # Auth
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get currently authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update user profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # Admin
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/templates:
    get:
      operationId: listAdminTemplates
      tags: [admin]
      summary: Admin list all templates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
    post:
      operationId: createTemplate
      tags: [admin]
      summary: Admin create a new template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"

  /admin/templates/{id}:
    put:
      operationId: updateTemplate
      tags: [admin]
      summary: Admin update a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
    delete:
      operationId: deleteTemplate
      tags: [admin]
      summary: Admin delete a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: Admin list all orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /admin/orders/{id}/confirm:
    post:
      operationId: confirmOrder
      tags: [admin]
      summary: Admin manually confirm a payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /admin/custom-requests:
    get:
      operationId: listAdminCustomRequests
      tags: [admin]
      summary: Admin list all custom design requests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomRequest"

  /admin/custom-requests/{id}/status:
    patch:
      operationId: updateCustomRequestStatus
      tags: [admin]
      summary: Admin update custom request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomRequestStatusBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRequest"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Admin list all users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/vouchers:
    get:
      operationId: listVouchers
      tags: [admin]
      summary: Admin list vouchers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voucher"
    post:
      operationId: createVoucher
      tags: [admin]
      summary: Admin create a voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoucherBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"

  /admin/reviews/{id}/hide:
    patch:
      operationId: hideReview
      tags: [admin]
      summary: Admin hide a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/blog:
    post:
      operationId: createBlogPost
      tags: [admin]
      summary: Admin create a blog post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlogPostBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Template:
      type: object
      required: [id, titleVi, titleEn, slug, price, thumbnailUrl, slideCount, aspectRatio, categoryId, categoryName, style, isFeatured, isBestSeller, avgRating, reviewCount, salesCount, createdAt]
      properties:
        id:
          type: integer
        titleVi:
          type: string
        titleEn:
          type: string
        slug:
          type: string
        price:
          type: number
        isFree:
          type: boolean
        thumbnailUrl:
          type: string
        previewImages:
          type: array
          items:
            type: string
        slideCount:
          type: integer
        aspectRatio:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        style:
          type: string
        tags:
          type: array
          items:
            type: string
        isFeatured:
          type: boolean
        isBestSeller:
          type: boolean
        avgRating:
          type: number
        reviewCount:
          type: integer
        salesCount:
          type: integer
        status:
          type: string
        createdAt:
          type: string

    TemplateDetail:
      allOf:
        - $ref: "#/components/schemas/Template"
        - type: object
          properties:
            descriptionVi:
              type: string
            descriptionEn:
              type: string
            features:
              type: array
              items:
                type: string
            compatibleSoftware:
              type: array
              items:
                type: string
            ratingDistribution:
              type: array
              items:
                $ref: "#/components/schemas/RatingDistribution"

    RatingDistribution:
      type: object
      required: [stars, count]
      properties:
        stars:
          type: integer
        count:
          type: integer

    TemplateListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Template"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Category:
      type: object
      required: [id, nameVi, nameEn, slug, icon, templateCount]
      properties:
        id:
          type: integer
        nameVi:
          type: string
        nameEn:
          type: string
        slug:
          type: string
        icon:
          type: string
        imageUrl:
          type: ["string", "null"]
        templateCount:
          type: integer

    Tag:
      type: object
      required: [id, name, templateCount]
      properties:
        id:
          type: integer
        name:
          type: string
        templateCount:
          type: integer

    SearchSuggestion:
      type: object
      required: [id, title, slug, thumbnailUrl, type]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        thumbnailUrl:
          type: string
        type:
          type: string

    Review:
      type: object
      required: [id, templateId, authorName, rating, comment, isVerifiedPurchase, createdAt, isHidden]
      properties:
        id:
          type: integer
        templateId:
          type: integer
        authorName:
          type: string
        rating:
          type: integer
        comment:
          type: string
        imageUrl:
          type: ["string", "null"]
        isVerifiedPurchase:
          type: boolean
        isHidden:
          type: boolean
        createdAt:
          type: string

    ReviewListResponse:
      type: object
      required: [items, avgRating, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        avgRating:
          type: number
        total:
          type: integer
        ratingDistribution:
          type: array
          items:
            $ref: "#/components/schemas/RatingDistribution"

    CreateReviewBody:
      type: object
      required: [rating, comment]
      properties:
        rating:
          type: integer
        comment:
          type: string
        imageUrl:
          type: string

    Cart:
      type: object
      required: [items, subtotal, discount, total, currency]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number
        currency:
          type: string
        appliedVoucher:
          type: ["string", "null"]

    CartItem:
      type: object
      required: [templateId, titleVi, titleEn, price, thumbnailUrl]
      properties:
        templateId:
          type: integer
        titleVi:
          type: string
        titleEn:
          type: string
        price:
          type: number
        thumbnailUrl:
          type: string

    AddToCartBody:
      type: object
      required: [templateId]
      properties:
        templateId:
          type: integer

    ApplyVoucherBody:
      type: object
      required: [code]
      properties:
        code:
          type: string

    Order:
      type: object
      required: [id, status, total, currency, items, customerName, customerEmail, createdAt, paymentMethod]
      properties:
        id:
